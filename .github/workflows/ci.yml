name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Format check, build and test
    runs-on: ubuntu-latest

    # Integration tests start their own throwaway Postgres with Testcontainers (Docker is built into the runner).
    env:
      # Dummy values: tests only need these properties to resolve; Paystack and email are mocked.
      PAYSTACK_SECRET_KEY: sk_test_ci
      PAYSTACK_PUBLIC_KEY: pk_test_ci
      JWT_SECRET: Y2ktb25seS1kdW1teS1qd3Qtc2VjcmV0LW5vdC1yZWFsLTEyMzQ1Ng==
      EXCHANGE_RATE_BASE_URL: https://example.invalid

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # verify runs spotless:check, compiles, runs tests and packages the jar
      - name: Build
        run: mvn -B verify
