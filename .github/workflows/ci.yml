name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Format check, build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corporate_internet_banking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/corporate_internet_banking
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: postgres
      # Dummy values: the context test only needs the properties to resolve, it never calls Paystack.
      PAYSTACK_SECRET_KEY: sk_test_ci
      PAYSTACK_PUBLIC_KEY: pk_test_ci
      JWT_SECRET: Y2ktb25seS1kdW1teS1qd3Qtc2VjcmV0LW5vdC1yZWFsLTEyMzQ1Ng==
      EXCHANGE_RATE_BASE_URL: https://example.invalid

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # verify runs spotless:check, compiles, runs tests and packages the jar
      - name: Build
        run: mvn -B verify
