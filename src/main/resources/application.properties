spring.application.name=corporateInternetBanking
# Local secrets live in a git-ignored .env file (copy .env.example); never commit real values here.
spring.config.import=optional:file:.env[.properties]
server.port=1990
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/corporate_internet_banking}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# A database created before Flyway already has the V1 tables: record it as version 1 instead of failing
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# SQL and Spring's auto-configuration report are noisy, so they are opt-in: set SHOW_SQL / APP_DEBUG in .env
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
application.security.jwt.secretKey=${JWT_SECRET}
# Access tokens are short-lived (default 30 min); clients renew them with the refresh token via POST /auth/refresh
application.security.jwt.expiration=${JWT_EXPIRATION_MS:1800000}
application.security.refresh-token.days=${REFRESH_TOKEN_DAYS:7}
# Failed logins: an email is locked after max-failures-per-email, an IP address after max-failures-per-ip
security.login.max-failures-per-email=${LOGIN_MAX_FAILURES_PER_EMAIL:5}
security.login.max-failures-per-ip=${LOGIN_MAX_FAILURES_PER_IP:20}
security.login.lockout-minutes=${LOGIN_LOCKOUT_MINUTES:15}
# Comma-separated browser origins allowed to call the API (defaults to the frontend URL)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${frontend.base-url}}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=1000
spring.mail.properties.mail.smtp.timeout=1000
spring.mail.properties.mail.smtp.writetimeout=1000
notification.jobs.interval=3600000
transaction.approval.expiry-hours=${TRANSACTION_APPROVAL_EXPIRY_HOURS:48}
exchange.rate.base.url=${EXCHANGE_RATE_BASE_URL}
#paystack
paystack.public.key=${PAYSTACK_PUBLIC_KEY}
paystack.secret.key=${PAYSTACK_SECRET_KEY}
paystack.dva.preferred-bank=${PAYSTACK_DVA_PREFERRED_BANK:test-bank}
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
debug=${APP_DEBUG:false}

