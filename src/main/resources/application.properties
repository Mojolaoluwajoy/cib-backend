spring.application.name=corporateInternetBanking
# Local secrets live in a git-ignored .env file (copy .env.example); never commit real values here.
spring.config.import=optional:file:.env[.properties]
server.port=1990
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/corporate_internet_banking}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
application.security.jwt.secretKey=${JWT_SECRET}
application.security.jwt.expiration=36000000
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=1000
spring.mail.properties.mail.smtp.timeout=1000
spring.mail.properties.mail.smtp.writetimeout=1000
notification.jobs.interval=3600000
exchange.rate.base.url=${EXCHANGE_RATE_BASE_URL}
#paystack
paystack.public.key=${PAYSTACK_PUBLIC_KEY}
paystack.secret.key=${PAYSTACK_SECRET_KEY}
paystack.dva.preferred-bank=${PAYSTACK_DVA_PREFERRED_BANK:test-bank}
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5175}
debug=true

